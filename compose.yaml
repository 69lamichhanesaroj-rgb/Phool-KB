services:
  api:
    build:
      context: .
      dockerfile: server/API/Dockerfile
    container_name: phool-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__Default=Data Source=/app/data/phool.db
      - Cors__ClientOrigin=http://10.5.71.74:8080
      - Jwt__Key=${JWT_KEY}
    volumes:
      - phool_data:/app/data

  web:
    build:
      context: ./client
    container_name: phool-web
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      - api

volumes:
  phool_data: